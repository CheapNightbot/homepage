name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: latest
          cache: true

      - name: Install dependencies
        run: deno install

      - name: Build
        run: deno task build

      - name: Checkout GitHub Pages repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CheapNightbot/cheapnightbot.github.io
          token: ${{ secrets.TOKEN_GITHUB_PAGES }}
          path: deploy

      - name: Copy built files to deploy directory
        run: |
          rm -rf deploy/*
          cp -r dist/* deploy/
          cp dist/.* deploy/ 2>/dev/null || true

      - name: Commit and push to GitHub Pages repo
        working-directory: deploy
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy from homepage: $(date)" || echo "No changes to commit"
          git push
